name: sekitar_app
description: Sekitar mobile client for iOS and Android.
publish_to: none
version: 0.12.26+42

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  file_picker: ^10.3.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
